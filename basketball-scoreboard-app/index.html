<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>    
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="scoreboard-card">
        <div class="scoreboard-container">
            <!-- Bagian Home -->
            <div class="team-section">
                <h2 class="team-title">HOME</h2>
                <div class="score-box">
                    <span class="score-number" id="home-score">0</span>
                </div>
                <div class="button-group">
                    <button class="btn btn-plus-one-home">+1</button>
                    <button class="btn btn-plus-two-home">+2</button>
                    <button class="btn btn-plus-three-home">+3</button>
                </div>
            </div>

            <!-- Bagian Guest -->
            <div class="team-section">
                <h2 class="team-title">GUEST</h2>
                <div class="score-box">
                    <span class="score-number" id="guest-score">0</span>
                </div>
                <div class="button-group">
                    <button class="btn btn-plus-one-guest">+1</button>
                    <button class="btn btn-plus-two-guest">+2</button>
                    <button class="btn btn-plus-three-guest">+3</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
